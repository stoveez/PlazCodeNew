name: Desktop Revamp Regression

on:
  push:
    branches:
      - desktop-revamp
  pull_request:
    branches:
      - main


concurrency:
  group: desktop-revamp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check extension
        shell: bash
        run: |
          set -e
          node --check background.js
          node --check popup.js
          for f in core/*.js providers/*.js; do node --check "$f"; done
      - name: Provider and desktop regression guard
        run: node test-desktop-regression.js
      - name: Existing parser regression
        run: node test-parser.js
      - name: Existing ChatGPT regression
        run: node test-chatgpt.js
      - name: Existing Claude regression
        run: node test-claude.js
      - name: Existing skills regression
        run: node test-skills.js
      - name: Existing animation regression
        run: node test-animlib.js
      - name: Existing blocking version regressions
        shell: bash
        run: |
          set -e
          node test-v111.js
          node test-v112.js
          node test-v118.js
      - name: Known baseline v1.15 check
        continue-on-error: true
        run: node test-v115.js

  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh WebView lockfile
        shell: pwsh
        run: cargo generate-lockfile --manifest-path agent/Cargo.toml
      - name: Cargo check
        shell: pwsh
        run: cargo check --locked --manifest-path agent/Cargo.toml
      - name: Cargo test
        shell: pwsh
        run: cargo test --locked --manifest-path agent/Cargo.toml
      - name: Build release agent
        shell: pwsh
        run: cargo build --release --locked --manifest-path agent/Cargo.toml
      - name: Embed PlazCode app icon
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File agent/embed-plazcode-icon.ps1 -ExePath agent/target/release/PlazCode.exe
      - name: Package PlazCode zip
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "PlazCode"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @(".git", "logs") } | ForEach-Object {
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }
          if (Test-Path (Join-Path $stage "agent\target")) {
            Remove-Item (Join-Path $stage "agent\target") -Recurse -Force
          }
          Copy-Item "agent\target\release\PlazCode.exe" (Join-Path $stage "PlazCode.exe") -Force
          Copy-Item "agent\target\release\PlazCode.exe" (Join-Path $stage "plazcode-agent.exe") -Force
          tar -a -c -f "PlazCode-1.18.60.zip" -C $env:RUNNER_TEMP PlazCode
      - uses: actions/upload-artifact@v4
        with:
          name: PlazCode-1.18.60
          path: PlazCode-1.18.60.zip
          if-no-files-found: error
          retention-days: 14
