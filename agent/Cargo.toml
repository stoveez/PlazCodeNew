[package]
name = "plazcode-agent"
version = "1.18.59"
edition = "2021"
description = "PlazCode native agent — Roblox Studio MCP + AgentScript workspace bridge"
license = "GPL-3.0-or-later"
authors = ["PlazCode"]

[[bin]]
name = "PlazCode"
path = "src/main.rs"

[dependencies]
getrandom = "0.2"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
sysinfo = { version = "0.32", features = [] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.26"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.20"

glob = "0.3"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "accesskit"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
